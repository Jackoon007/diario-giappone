<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diario Giappone</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#202023">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Giappone">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600;700&family=Patrick+Hand+SC&family=Unbounded:wght@800&display=swap">
<style>
/* Layout: una guida tascabile. Banda scura in alto, quattro stanze in basso su telefono,
   doppia pagina da 960px: testo a sinistra, dati mappa e note a destra. */
:root{
  --page:#FBF8F2; --card:#FFFFFF; --band:#202023; --ink:#202023; --muted:#5C5C63;
  --lead:#C21E5B; --display:#5A3E99; --link:#5A3E99; --rule:#5C5C63; --rule-soft:#D8D2C4;
  --edge:#202023; --focus:#5A3E99; --id-bg:#202023; --on-id:#FFFFFF; --star:#C21E5B;
  --visited:#2B6F69; --on-visited:#FFFFFF; --mark:#FBEA8A; --on-mark:#202023; --danger:#A9134D;
  /* fissi in entrambi i temi */
  --yellow:#F6D52B; --charcoal:#202023; --band-muted:#F1ECE1; --purple:#5A3E99; --purple-d:#432C80;
  --pink:#C8155A; --pink-d:#A9134D; --teal:#2B6F69; --white:#FFFFFF;
  --water:#A9D6EE; --land:#DAD6CE; --lavender:#DCD2F2; --pink-pale:#FFE3EE; --teal-pale:#CDEAE6;
  --f-display:"Anton","Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --f-city:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-hand:"Patrick Hand SC","Segoe Print","Bradley Hand",cursive;
  --stamp:4px 4px 0 0 var(--edge);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --page:#151517; --card:#2B2B30; --band:#0B0B0C; --ink:#FBF8F2; --muted:#A8A8AE;
  --lead:#FF8AB0; --display:#F6D52B; --link:#F6D52B; --rule:#A8A8AE; --rule-soft:#5C5C63;
  --edge:#0B0B0C; --focus:#F6D52B; --id-bg:#FBF8F2; --on-id:#202023; --star:#FF8AB0;
  --visited:#4DA69C; --on-visited:#202023; --mark:#F6D52B; --on-mark:#202023; --danger:#FF8AB0;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --page:#151517; --card:#2B2B30; --band:#0B0B0C; --ink:#FBF8F2; --muted:#A8A8AE;
  --lead:#FF8AB0; --display:#F6D52B; --link:#F6D52B; --rule:#A8A8AE; --rule-soft:#5C5C63;
  --edge:#0B0B0C; --focus:#F6D52B; --id-bg:#FBF8F2; --on-id:#202023; --star:#FF8AB0;
  --visited:#4DA69C; --on-visited:#202023; --mark:#F6D52B; --on-mark:#202023; --danger:#FF8AB0;
  color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--page);color:var(--ink);font:400 15px/24px var(--f-mono);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--band)}
h1,h2,h3,p{margin:0}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.band :focus-visible,.nav :focus-visible,.cover :focus-visible{outline-color:var(--yellow)}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
svg.i.s{width:18px;height:18px}
.num{font-variant-numeric:tabular-nums}

/* banda titolo */
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--yellow)}
.band-in{max-width:1120px;margin:0 auto;min-height:64px;display:flex;align-items:center;gap:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:400 28px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase;color:var(--yellow);text-decoration:none;
  min-width:0;overflow-wrap:anywhere;padding-block:8px}
.band-nav{display:none;gap:4px;margin-left:auto}
.band-nav a{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;color:var(--band-muted);
  text-decoration:none;font:600 12px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border-radius:4px}
.band-nav a[aria-current="page"]{background:var(--yellow);color:var(--charcoal)}
.edit-btn{margin-left:auto;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;background:transparent;
  border:2px solid var(--yellow);border-radius:4px;color:var(--yellow);font:600 12px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.edit-btn[aria-pressed="true"]{background:var(--yellow);color:var(--charcoal)}

/* barra in basso */
.nav{position:fixed;inset:auto 0 0;z-index:20;background:var(--band);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:60px;color:var(--band-muted);
  text-decoration:none;font:600 12px/16px var(--f-mono);letter-spacing:.04em;text-transform:uppercase}
.nav a[aria-current="page"]{color:var(--charcoal);background:var(--yellow)}

main{max-width:1120px;margin:0 auto;padding-block:0 112px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:32px}
.spread{display:grid;gap:32px;grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:32px;min-width:0}
@media (min-width:960px){
  .nav{display:none}.band-nav{display:flex}.edit-btn{margin-left:8px}
  main{padding-block:0 64px}
  .spread{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
}

/* copertina */
.cover{margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  background-color:var(--c-bg,var(--purple));color:var(--white);position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;inset:0 0 0 auto;width:38%;opacity:.55;pointer-events:none;
  background:repeating-linear-gradient(135deg,var(--c-hatch,var(--purple-d)) 0 10px,transparent 10px 22px)}
.cover-in{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;padding-block:32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cover[data-c="rosa"]{--c-bg:var(--pink);--c-hatch:var(--pink-d);--c-soft:var(--pink-pale)}
.cover[data-c="viola"]{--c-bg:var(--purple);--c-hatch:var(--purple-d);--c-soft:var(--lavender)}
.cover[data-c="teal"]{--c-bg:var(--teal);--c-hatch:#1F524D;--c-soft:var(--teal-pale)}
.cover[data-c="carbone"]{--c-bg:var(--charcoal);--c-hatch:#3A3A40;--c-soft:var(--band-muted)}
.city{font:800 clamp(30px,9vw,56px)/1 var(--f-city);letter-spacing:-.02em;text-transform:uppercase;color:var(--yellow);overflow-wrap:anywhere}
.cover .kicker{color:var(--c-soft,var(--lavender))}
.cover-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.cover p.sub{font:500 17px/26px var(--f-mono);max-width:46ch}
@media (min-width:1152px){.cover{margin-inline:0}.cover-in{padding-inline:32px}}

.kicker,.label{font:600 12px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.label{color:var(--muted)}
.data{font:500 14px/20px var(--f-mono);letter-spacing:.02em;text-transform:uppercase}
.lead{font:500 17px/26px var(--f-mono);color:var(--lead);max-width:62ch}
.body{max-width:62ch;white-space:pre-line}
.small{font-size:13px;line-height:20px;color:var(--muted)}
.display{font:400 28px/1.05 var(--f-display);letter-spacing:.01em;text-transform:uppercase;color:var(--display);text-wrap:balance}
@media (min-width:960px){.display{font-size:40px;line-height:1}}

/* sezione */
.sec{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec-head{display:flex;align-items:center;gap:12px;background:var(--band);color:var(--yellow);min-height:44px;padding:0 4px 0 16px}
.sec-head h2{font:700 18px/22px var(--f-mono);letter-spacing:.02em;text-transform:uppercase;flex:1;min-width:0;padding-block:11px}
.sec-head .add{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;background:transparent;border:0;color:var(--yellow);
  font:600 12px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding-block:12px;border-bottom:1px solid var(--rule-soft);min-width:0}
.row:first-child{border-top:1px solid var(--rule-soft)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row h3{font:700 15px/22px var(--f-mono);text-transform:uppercase;overflow-wrap:anywhere}
.empty{border:2px dashed var(--rule);padding:16px;color:var(--muted);font-size:13px;line-height:20px}

.tag{display:inline-flex;align-items:center;min-height:24px;padding:2px 8px;border-radius:2px;background:var(--yellow);color:var(--charcoal);
  font:600 12px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.tag.teal{background:var(--teal);color:var(--white)}
.tag.line{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.idb{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:999px;background:var(--id-bg);color:var(--on-id);
  font:700 14px/14px var(--f-mono);flex:none}
.stars{color:var(--star);font:700 16px/1 var(--f-mono);letter-spacing:4px;white-space:nowrap}

/* pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 14px;border:2px solid var(--edge);border-radius:4px;
  background:var(--yellow);color:var(--charcoal);box-shadow:var(--stamp);font:600 12px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.btn:hover{box-shadow:6px 6px 0 0 var(--edge)}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn.sec2{background:var(--card);color:var(--ink);border-color:var(--rule);box-shadow:none}
.btn.sec2:active{transform:none;background:var(--mark);color:var(--on-mark)}
.btn.danger{background:var(--card);color:var(--danger);border-color:var(--danger);box-shadow:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;flex:none;background:transparent;border:0;color:var(--muted);border-radius:4px}
.icon-btn:hover{color:var(--ink)}
.sec-head .icon-btn{color:var(--yellow)}
body:not(.editing) .only-edit{display:none!important}

/* indice dei giorni */
.day-link{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule-soft);text-decoration:none;color:var(--ink);min-height:56px}
.day-link:first-child{border-top:1px solid var(--rule-soft)}
.day-link .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.day-link strong{font-weight:700;text-transform:uppercase;overflow-wrap:anywhere}
.day-link.today strong{background:var(--mark);color:var(--on-mark);padding:0 4px;align-self:flex-start}

.cards{display:grid;gap:24px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.icard{display:flex;flex-direction:column;background:var(--card);border:2px solid var(--edge);box-shadow:var(--stamp);text-decoration:none;color:var(--ink);min-width:0}
.icard-head{display:flex;justify-content:space-between;gap:8px;background:var(--teal);color:var(--white);padding:8px 12px;font:600 12px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.icard-body{display:flex;flex-direction:column;gap:8px;padding:16px}
.icard .cname{font:800 22px/1.1 var(--f-city);letter-spacing:-.02em;text-transform:uppercase;color:var(--display);overflow-wrap:anywhere}
.icard:active{transform:translate(4px,4px);box-shadow:none}

/* scaletta del giorno */
.stop{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding-block:16px;border-bottom:1px solid var(--rule-soft)}
.stop:first-child{border-top:1px solid var(--rule-soft)}
.stop-time{font:700 15px/22px var(--f-mono);font-variant-numeric:tabular-nums}
.stop-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.stop-top{display:flex;gap:8px;align-items:flex-start}
.stop-top h3{flex:1;min-width:0;font:700 17px/24px var(--f-mono);text-transform:uppercase;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;align-items:flex-start;font:500 14px/20px var(--f-mono)}
.meta svg{margin-top:1px}
.leave{display:flex;gap:8px;align-items:center;background:var(--mark);color:var(--on-mark);padding:6px 8px;font:600 13px/20px var(--f-mono);align-self:flex-start}
.chk{display:grid;place-items:center;width:44px;height:44px;flex:none;margin:-10px -8px -10px 0;background:transparent;border:0;padding:0}
.chk span{display:grid;place-items:center;width:28px;height:28px;border:2px solid var(--rule);border-radius:999px;color:transparent}
.chk[aria-pressed="true"] span{background:var(--visited);border-color:var(--visited);color:var(--on-visited)}

.callout{display:flex;flex-direction:column;gap:4px;border:2px solid var(--teal);padding:12px;background:var(--card)}
.callout b{color:var(--lead);font-weight:700}
.tiprow{display:flex;gap:4px;align-items:flex-start}
.tiprow .callout{flex:1;min-width:0}

.hotel{display:flex;flex-direction:column;gap:8px;background:var(--card);border:2px solid var(--edge);padding:16px}

/* note */
.pad{background-color:var(--card);background-image:radial-gradient(var(--rule-soft) 1.2px,transparent 1.3px);background-size:16px 16px;
  border:1px solid var(--rule);display:flex;flex-direction:column}
.pad textarea{background:transparent;border:0;resize:vertical;min-height:176px;padding:16px;font:400 20px/32px var(--f-hand);letter-spacing:.02em;width:100%}
.pad textarea::placeholder{color:var(--muted);opacity:1}
.saved{align-self:flex-end;padding:0 8px 4px;font-size:12px;line-height:16px;color:var(--muted);min-height:20px}

/* mappa */
.map{background:var(--land);border:2px solid var(--edge);border-radius:8px;overflow:hidden;position:relative}
.map svg{display:block;width:100%;height:auto}
.map text{font:700 13px var(--f-mono);fill:#202023;paint-order:stroke;stroke:#FBF8F2;stroke-width:4px;stroke-linejoin:round}
.map .pin{cursor:pointer}
.map .pin:focus-visible{outline:none}
.map .pin:focus-visible circle.ring{stroke:#202023;stroke-width:5}
.map-empty{padding:32px 16px;color:#202023;text-align:center;font-size:13px;line-height:20px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;line-height:16px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.legend i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px;border-radius:999px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.chip{flex:none;min-height:44px;padding:0 14px;border:2px solid var(--rule);border-radius:999px;background:var(--card);color:var(--ink);
  font:600 12px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--yellow);border-color:var(--edge);color:var(--charcoal)}
.sel{background:var(--card);border:2px solid var(--edge);box-shadow:var(--stamp);padding:16px;display:flex;flex-direction:column;gap:12px}
.row.is-sel{background:var(--mark);color:var(--on-mark);padding-inline:8px}
.row.is-sel .label,.row.is-sel .small{color:var(--on-mark)}
.plain{background:transparent;border:0;padding:0;text-align:left;min-height:44px;display:flex;gap:12px;align-items:center;flex:1;min-width:0}

.pager{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:400 40px/1 var(--f-display);color:var(--yellow)}
.banner{background:var(--mark);color:var(--on-mark);padding:8px 12px;font-size:13px;line-height:20px;display:flex;gap:8px;align-items:flex-start}

/* scheda di modifica */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(11,11,12,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--page);color:var(--ink);width:100%;max-width:560px;max-height:92%;display:flex;flex-direction:column;border:2px solid var(--edge)}
.sheet-head{display:flex;align-items:center;background:var(--band);color:var(--yellow);padding:0 4px 0 16px;min-height:56px}
.sheet-head h2{flex:1;font:700 18px/22px var(--f-mono);letter-spacing:.02em;text-transform:uppercase}
.sheet-head .icon-btn{color:var(--yellow)}
.sheet form{display:flex;flex-direction:column;gap:16px;padding:16px;overflow-y:auto;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font:600 12px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.fld input,.fld select,.fld textarea{min-height:44px;padding:8px 12px;border:2px solid var(--rule);border-radius:4px;background:var(--card);font-size:16px;line-height:24px;width:100%;min-width:0}
.fld textarea{min-height:96px;resize:vertical}
.fld small{font-size:13px;line-height:20px;color:var(--muted)}
.fld .err{color:var(--danger);font-weight:600}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sheet-foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding-top:8px}
@media (min-width:640px){.scrim{align-items:center}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--band);color:var(--yellow);
  padding:10px 16px;font:600 12px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--yellow);max-width:calc(100% - 32px)}
.loading{padding-block:64px;color:var(--muted)}
.sync-btn{margin-left:auto;position:relative;display:flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;padding:0 10px;background:transparent;
  border:2px solid var(--band-muted);border-radius:4px;color:var(--band-muted);font:600 12px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.sync-btn .dot{width:10px;height:10px;border-radius:50%;background:#3FB27F;flex:none}
.sync-btn[data-st="wait"] .dot{background:var(--yellow)}
.sync-btn[data-st="err"] .dot,.sync-btn[data-st="local"] .dot{background:#E8590C}
.sync-btn[data-st="busy"] .dot{background:var(--band-muted)}
.edit-btn{margin-left:8px}
@media (max-width:420px){.brand{font-size:22px}.sync-btn .lbl{display:none}}
@media (min-width:960px){.sync-btn{margin-left:auto}.band-nav{margin-left:16px}}
.sync-info{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.sync-info p{margin:0}

</style>

</head><body>
<header class="band">
  <div class="band-in">
    <a class="brand" href="#sunto" id="brand">Diario Giappone</a>
    <nav class="band-nav" id="topnav" aria-label="Sezioni"></nav>
    <button class="sync-btn" id="syncBtn" type="button" data-act="sync-panel" aria-label="Sincronizzazione"><span class="dot"></span><span class="lbl">Sync</span></button>
    <button class="edit-btn" id="editBtn" type="button" aria-pressed="false"></button>
  </div>
</header>
<main id="app" tabindex="-1"><p class="loading">Apro la guida…</p></main>
<nav class="nav" id="botnav" aria-label="Sezioni"></nav>
<div id="sheetHost"></div>
<div id="toastHost" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* ---------- utilità ---------- */

function fDate(s,noDow){var d=pDate(s);if(!d)return '';return (noDow?'':DOW[d.getDay()]+' ')+d.getDate()+' '+MON[d.getMonth()]}

function dayDiff(a,b){var x=pDate(a),y=pDate(b);return (x&&y)?Math.round((y-x)/864e5):null}
function two(n){return ('0'+n).slice(-2)}
function safeUrl(u){u=String(u||'').trim();if(!u)return '';if(/^https?:\/\//i.test(u))return u;if(/^[\w-]+(\.[\w-]+)+(\/|$)/.test(u))return 'https://'+u;return ''}

function canon(v){if(Array.isArray(v))return '['+v.map(canon).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).sort().filter(function(k){return v[k]!==undefined}).map(function(k){return JSON.stringify(k)+':'+canon(v[k])}).join(',')+'}';
  return JSON.stringify(v===undefined?null:v)}
function ceq(a,b){return canon(a)===canon(b)}
function isObj(x){return !!x&&typeof x==='object'&&!Array.isArray(x)}
function idArr(x){return Array.isArray(x)&&x.every(function(e){return isObj(e)&&e.id!=null})}
function idx(a){var o={};a.forEach(function(e){o[e.id]=e});return o}
/* fusione a tre vie: b = com'era, m = mia versione, t = versione remota */
function merge3(b,m,t){
  if(ceq(m,b))return t; if(ceq(t,b)||ceq(m,t))return m;
  if(isObj(m)&&isObj(t)){var bb=isObj(b)?b:{},o={},ks={};Object.keys(m).concat(Object.keys(t)).forEach(function(k){ks[k]=1});
    Object.keys(ks).forEach(function(k){var r=merge3(bb[k],m[k],t[k]);if(r!==undefined)o[k]=r});return o}
  if(idArr(m)&&idArr(t)&&(b==null||idArr(b))){var bm=idx(b||[]),tm=idx(t),mm=idx(m),out=[];
    m.forEach(function(e){var id=e.id;if(tm[id]!==undefined){var r=merge3(bm[id],e,tm[id]);if(r!==undefined)out.push(r)}
      else if(bm[id]!==undefined){if(!ceq(e,bm[id]))out.push(e)}else out.push(e)});
    t.forEach(function(e){var id=e.id;if(mm[id]!==undefined)return;if(bm[id]!==undefined){if(!ceq(e,bm[id]))out.push(e)}else out.push(e)});
    return out}
  return m}
function toMap(data){var m={trip:data&&data.trip?data.trip:null,days:{}};((data&&data.days)||[]).forEach(function(d){m.days[d.id]=d});return m}
function fromMap(m){var days=Object.keys(m.days).map(function(id){var d=m.days[id];d.id=id;return d});
  days.sort(function(a,b){return (a.date||'9999').localeCompare(b.date||'9999')||String(a.id).localeCompare(String(b.id))});return {trip:m.trip,days:days}}
function applyOps(m,ops){ops.forEach(function(op){
  if(op.p==='trip'){var tr=merge3(op.b,op.a,m.trip);m.trip=tr===undefined?null:tr;return}
  var id=op.p.slice(4);if(op.a==null){delete m.days[id];return}
  var r=merge3(op.b,op.a,m.days[id]);if(r===undefined)delete m.days[id];else{r=clone(r);r.id=id;m.days[id]=r}});return m}


/* ---------- cifratura: AES-GCM con chiave da password (PBKDF2) ---------- */
var ITER=310000;
function bytesToB64(u){var bin='';for(var i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(bin)}
function b64ToBytes(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function deriveKey(pw,saltB64,iter){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBytes(saltB64),iterations:iter||ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}
async function useKey(key,salt){SY.key=key;SY.salt=salt;var raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));SY.rawKey=bytesToB64(raw);
  try{localStorage.setItem(LS+'-pw',JSON.stringify({k:SY.rawKey,s:salt}))}catch(e){}}
async function loadKey(){try{var o=JSON.parse(localStorage.getItem(LS+'-pw')||'null');if(!o)return;
  SY.key=await crypto.subtle.importKey('raw',b64ToBytes(o.k),{name:'AES-GCM'},true,['encrypt','decrypt']);SY.salt=o.s;SY.rawKey=o.k}catch(e){}}
function isEnc(d){return d&&d.enc===1&&d.ct}
async function openBlob(d){if(!isEnc(d))return d;
  if(!SY.key||SY.salt!==d.salt){SY.blob=d;throw {code:'locked'}}
  try{var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(d.iv)},SY.key,b64ToBytes(d.ct))}catch(e){SY.blob=d;throw {code:'locked'}}
  return JSON.parse(new TextDecoder().decode(pt))}
async function sealBlob(data){if(!SY.key)throw {code:'locked'};var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},SY.key,new TextEncoder().encode(JSON.stringify(data))));
  return {enc:1,kdf:'PBKDF2-SHA256',iter:ITER,salt:SY.salt,iv:bytesToB64(iv),ct:bytesToB64(ct)}}
async function unlock(pw){var b=SY.blob;if(!b)throw {code:'net'};var k=await deriveKey(pw,b.salt,b.iter);
  try{var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(b.iv)},k,b64ToBytes(b.ct))}catch(e){throw {code:'badpw'}}
  await useKey(k,b.salt);SY.locked=false;SY.err='';setLocal(toMap(JSON.parse(new TextDecoder().decode(pt))));syncNow(false)}
async function changePassword(pw){
  if(!SY.token)throw {code:'auth'};if(!navigator.onLine)throw {code:'offline'};
  var rem=await fetchRemote(),m=toMap(rem.data);applyOps(m,SY.ops);
  var salt=bytesToB64(crypto.getRandomValues(new Uint8Array(16)));await useKey(await deriveKey(pw,salt,ITER),salt);
  await putRemote(fromMap(m),rem.sha);SY.ops=[];setLocal(m);writeCache()}

function readCache(){try{var c=JSON.parse(localStorage.getItem(LS)||'null');if(c&&typeof c==='object'){S.trip=c.trip||null;S.days=Array.isArray(c.days)?c.days:[];
  SY.ops=Array.isArray(c.ops)?c.ops:[];SY.last=c.last||0}}catch(e){}
  try{SY.token=localStorage.getItem(LS+'-key')||'';SY.who=localStorage.getItem(LS+'-who')||''}catch(e){}}
function writeCache(){try{localStorage.setItem(LS,JSON.stringify({trip:S.trip,days:S.days,ops:SY.ops,last:SY.last}))}catch(e){}}
function sortDays(){S.days.sort(function(a,b){return (a.date||'9999').localeCompare(b.date||'9999')||String(a.id).localeCompare(String(b.id))})}
function snapAll(){SH={trip:S.trip?clone(S.trip):null};S.days.forEach(function(d){SH['day:'+d.id]=clone(d)})}
function record(p,after){var a=after==null?null:clone(after);
  var ex=SY.ops.find(function(o){return o.p===p});
  if(ex)ex.a=a;else SY.ops.push({p:p,b:SH.hasOwnProperty(p)?SH[p]:null,a:a});
  SH[p]=a;writeCache();paintSync();scheduleSync(1500)}
function saveTrip(quiet){record('trip',S.trip);if(!quiet)render()}
function saveDay(d,quiet){sortDays();record('day:'+d.id,d);if(!quiet)render()}
function removeDay(id){S.days=S.days.filter(function(d){return d.id!==id});record('day:'+id,null)}
function setLocal(m){if(sheet){SY.deferred=m;return}var o=fromMap(m);
  S.trip=o.trip?normTrip(clone(o.trip)):null;S.days=o.days.map(function(d){return normDay(clone(d))});sortDays();snapAll();S.ready=true;writeCache();render()}

function b64dec(s){var bin=atob(String(s).replace(/\s/g,'')),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function b64enc(str){var u=new TextEncoder().encode(str),bin='';for(var i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(bin)}
function ghHeaders(){var h={'Accept':'application/vnd.github+json'};if(SY.token)h.Authorization='Bearer '+SY.token;return h}
async function fetchRemote(){var r;
  try{r=await fetch(API+'?ref=main&t='+Date.now(),{headers:ghHeaders(),cache:'no-store'})}catch(e){r=null}
  if(r&&r.ok){var j=await r.json();return {sha:j.sha,data:await openBlob(JSON.parse(b64dec(j.content)))}}
  if(r&&r.status===401)throw {code:'auth'};
  if(SY.token&&r&&r.status===404)throw {code:'auth'};
  /* senza chiave o con il limite di GitHub raggiunto: legge la copia pubblicata del sito */
  var p=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!p.ok)throw {code:'net'};
  return {sha:'',data:await openBlob(await p.json())}}
async function putRemote(data,sha){
  var r=await fetch(API,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),
    body:JSON.stringify({message:'Modifiche dal telefono'+(SY.who?' di '+SY.who:''),content:b64enc(JSON.stringify(await sealBlob(data))+'\n'),sha:sha,branch:'main'})});
  if(r.status===409||r.status===422)throw {code:'conflict'};
  if(r.status===401||r.status===403||r.status===404)throw {code:'auth'};
  if(!r.ok)throw {code:'net'};return (await r.json()).content.sha}
function scheduleSync(ms){clearTimeout(SY.t);SY.t=setTimeout(function(){syncNow(false)},ms||1500)}
async function syncNow(manual){
  if(SY.busy){SY.again=true;return}
  if(sheet){scheduleSync(4000);return}
  if(!navigator.onLine){paintSync();if(manual)toast('Sei offline: le modifiche restano sul telefono');return}
  SY.busy=true;paintSync();
  try{
    for(var tries=0;tries<4;tries++){
      var rem=await fetchRemote(),m=toMap(rem.data);
      if(SY.token&&rem.sha&&SY.ops.length){
        var sent=SY.ops.map(function(o){return {o:o,a:clone(o.a)}});
        applyOps(m,SY.ops);
        try{await putRemote(fromMap(m),rem.sha)}catch(e){if(e.code==='conflict')continue;throw e}
        SY.ops=SY.ops.filter(function(o){var s=sent.find(function(x){return x.o===o});if(!s)return true;if(ceq(o.a,s.a))return false;o.b=s.a;return true});
        applyOps(m,SY.ops);
      } else applyOps(m,SY.ops);
      setLocal(m);SY.last=Date.now();SY.err='';
      if(manual)toast(SY.ops.length?'Aggiornato. Modifiche ancora solo su questo telefono':'Tutto sincronizzato');
      break}
  }catch(e){SY.err=(e&&e.code)||'net';if(SY.err==='locked'){SY.err='';if(!SY.locked){SY.locked=true;render()}return}if(manual)toast(SY.err==='auth'?'La chiave non funziona: controllala':'Sincronizzazione non riuscita. Riprovo più tardi')}
  finally{SY.busy=false;writeCache();paintSync();if(SY.again){SY.again=false;scheduleSync(500)}}}

function syncState(){var n=SY.ops.length;
  if(SY.locked)return ['err','Bloccata','Serve la password'];
  if(SY.busy)return ['busy','Sync…','Sincronizzazione in corso'];
  if(!navigator.onLine)return ['wait','Offline'+(n?' '+n:''),'Offline'+(n?': '+n+' modifiche in attesa':': stai usando la copia sul telefono')];
  if(SY.err==='auth')return ['err','Chiave','La chiave di sincronizzazione non funziona'];
  if(n&&!SY.token)return ['local','Locale '+n,n+' modifiche salvate solo su questo telefono'];
  if(SY.err)return ['err','Errore','Ultima sincronizzazione non riuscita'];
  if(n)return ['wait',n+' in attesa',n+' modifiche da inviare'];
  return ['ok','Sync','Sincronizzato']}
function paintSync(){var b=document.getElementById('syncBtn');if(!b)return;var s=syncState();
  b.dataset.st=s[0];b.querySelector('.lbl').textContent=s[1];b.setAttribute('aria-label',s[2]+'. Apri le impostazioni di sincronizzazione')}
function hhmm(t){if(!t)return 'mai';var d=new Date(t);return fDate(d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate()))+', '+two(d.getHours())+':'+two(d.getMinutes())}
function openSync(){var s=syncState();
  var intro='<div class="sync-info"><p><b>'+esc(s[2])+'.</b> Ultimo aggiornamento: '+esc(hhmm(SY.last))+'.</p>'+
    '<p class="small">Tutto il viaggio resta sul telefono e si consulta anche senza rete. '+(SY.token?'Le modifiche partono da sole appena c\'è connessione.':'Senza chiave puoi consultare e modificare, ma le modifiche restano su questo telefono finché non inserisci la chiave.')+'</p>'+
    '<div class="btns"><button type="button" class="btn" data-act="sync-now">'+ic('route',1)+'Sincronizza ora</button>'+
    (SY.token?'<button type="button" class="btn sec2" data-act="copy-invite">'+ic('out',1)+'Copia link con chiave</button>':'')+'</div></div>';
  openSheet({title:'Sincronizzazione',intro:intro,fields:[{k:'who',l:'Chi usa questo telefono',h:'Compare nella cronologia delle modifiche, per esempio Anna.'},{k:'key',l:'Chiave di sincronizzazione',t:'password',h:'Il token GitHub che ti ha dato Giacomo. Si inserisce una volta sola.'},{k:'newpw',l:'Nuova password del diario',t:'password',h:'Lascia vuoto per non cambiarla. Serve la chiave e la rete. Poi chi usa l\'altro telefono dovrà inserire la nuova password.'}],
    values:{who:SY.who,key:SY.token,newpw:''},onSave:function(o){var npw=o.newpw;delete o.newpw;var changed=o.key!==SY.token;SY.who=o.who;SY.token=o.key;
      try{localStorage.setItem(LS+'-who',o.who);localStorage.setItem(LS+'-key',o.key)}catch(e){}
      if(npw){if(npw.length<8){toast('Password troppo corta: almeno 8 caratteri');return}
        changePassword(npw).then(function(){toast('Password cambiata')},function(e){toast(e&&e.code==='offline'?'Serve la rete per cambiare password':e&&e.code==='auth'?'Serve una chiave valida':'Cambio password non riuscito')});return}
      if(changed){SY.err='';syncNow(true)}paintSync()}})}
function takeKeyFromHash(){var h=location.hash||'',inv=/^#invito=(.+)$/.exec(h),m=/^#chiave=(.+)$/.exec(h);if(!inv&&!m)return false;
  if(inv){try{var o=JSON.parse(atob(decodeURIComponent(inv[1])));SY.token=String(o.t||'').trim();
    if(o.k&&o.s){try{localStorage.setItem(LS+'-pw',JSON.stringify({k:o.k,s:o.s}))}catch(e){}loadKey().then(function(){SY.locked=false;syncNow(false)})}}catch(e){}}
  else SY.token=decodeURIComponent(m[1]).trim();SY.err='';try{localStorage.setItem(LS+'-key',SY.token)}catch(e){}
  try{history.replaceState(null,'',location.pathname+'#sunto')}catch(e){location.hash='sunto'}
  setTimeout(function(){toast('Chiave salvata: le modifiche si sincronizzano');render();syncNow(false)},0);return true}
async function copyInvite(){var u=location.origin+location.pathname+'#invito='+encodeURIComponent(btoa(JSON.stringify({t:SY.token,k:SY.rawKey,s:SY.salt})));
  try{await navigator.clipboard.writeText(u);toast('Link copiato: contiene chiave e password, mandalo solo ad Anna')}catch(e){toast('Copia non riuscita')}}
function day(id){return S.days.find(function(d){return d.id===id})}
function dayNo(d){return S.days.indexOf(d)+1}
function normDay(d){d.items=Array.isArray(d.items)?d.items:[];d.shops=Array.isArray(d.shops)?d.shops:[];d.tips=Array.isArray(d.tips)?d.tips:[];return d}
function normTrip(t){['flights','stays','tips','reminders'].forEach(function(k){t[k]=Array.isArray(t[k])?t[k]:[]});return t}
function sortedItems(d){return d.items.slice().sort(function(a,b){return (a.time||'99:99').localeCompare(b.time||'99:99')})}

async function boot(){
  readCache(); await loadKey(); takeKeyFromHash();
  if(!SY.key){SY.locked=true;S.trip=null;S.days=[]}
  if(S.trip){normTrip(S.trip);S.days.forEach(normDay);sortDays();S.ready=true}
  snapAll(); render();
  if(!S.trip){
    try{var r=await fetch('data.json',{cache:'no-cache'});if(r.ok){var d=await r.json();
      if(isEnc(d)){SY.blob=d;if(SY.key){try{setLocal(toMap(await openBlob(d)));SY.locked=false}catch(e){SY.locked=true}}else SY.locked=true}
      else{SY.locked=false;setLocal(toMap(d))}}}catch(e){}
    S.ready=true;render();
  }
  syncNow(false);
  window.addEventListener('online',function(){paintSync();syncNow(false)});
  window.addEventListener('offline',paintSync);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&Date.now()-SY.last>60000)syncNow(false)});
  setInterval(function(){if(document.visibilityState==='visible')syncNow(false)},300000);
}

/* ---------- link esterni ---------- */
function mapsQ(o,city){return (o.maps&&!/^https?:/i.test(o.maps))?o.maps:[o.name,city,'Giappone'].filter(Boolean).join(' ')}
function mapsUrl(o,city){var u=safeUrl(/^https?:/i.test(o.maps||'')?o.maps:'');if(u)return u;var ll=getLL(o);
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(o.maps||(ll&&!o.name?ll.join(','):mapsQ(o,city)))}
function place(o,city){var ll=getLL(o);if(o.maps&&!/^https?:/i.test(o.maps))return o.maps;return ll?ll.join(','):mapsQ(o,city)}
function hotelPlace(d){if(!d.hotel&&!d.hotelMaps)return '';return place({name:d.hotel,maps:d.hotelMaps,coords:d.hotelCoords},d.city)}
function dirUrl(d,o){var u='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(place(o,d.city))+'&travelmode=transit';
  var h=hotelPlace(d);if(h)u+='&origin='+encodeURIComponent(h);return u}
function routeUrl(d){var its=sortedItems(d);if(!its.length)return '';var h=hotelPlace(d),pts=its.map(function(o){return place(o,d.city)});
  var origin=h||pts.shift();if(!pts.length)return '';var dest=pts.pop();
  var u='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(dest);
  if(pts.length)u+='&waypoints='+encodeURIComponent(pts.slice(0,9).join('|'));return u}
function getLL(o){var m=/(-?\d{1,2}\.\d+)\s*[,;]\s*(-?\d{1,3}\.\d+)/.exec(o.coords||'');

    :empty('Nessun promemoria. Esempi: prenotare un museo, comprare il pass dei treni, fare il check-in online.'))+'</section>'}

/* ---------- schermata password ---------- */
function vLock(){return '<section class="cover" data-c="carbone"><div class="cover-in"><p class="kicker">Diario privato</p><h1 class="city">Giappone</h1></div></section>'+
  '<section class="col" style="max-width:520px"><form id="lockForm" class="col" style="gap:16px" novalidate>'+
  '<p>I dati del viaggio sono protetti. Inserisci la password che ti ha dato Giacomo: serve una volta sola su questo telefono.</p>'+
  '<div class="fld"><label for="lockPw">Password del diario</label><input id="lockPw" type="password" autocomplete="current-password" autocapitalize="off">'+
  '<small class="err" id="lockErr" role="alert" hidden></small></div>'+
  '<div class="btns"><button type="submit" class="btn">'+ic('check',1)+'Apri il diario</button></div>'+
  '<p class="small">Se Giacomo ti ha mandato un link di invito, aprilo da questo telefono: la password si inserisce da sola.</p></form></section>'}
document.addEventListener('submit',function(e){if(e.target.id!=='lockForm')return;e.preventDefault();
  var pw=$('#lockPw').value,er=$('#lockErr');er.hidden=true;if(!pw){er.textContent='Scrivi la password.';er.hidden=false;return}
  var btn=e.target.querySelector('button');btn.disabled=true;
  (SY.blob?Promise.resolve():fetch('data.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){if(isEnc(d))SY.blob=d}))
  .then(function(){return unlock(pw)}).then(function(){toast('Diario aperto')},function(x){btn.disabled=false;
    er.textContent=x&&x.code==='badpw'?'Password sbagliata. Riprova.':'Non riesco a leggere i dati: serve la rete la prima volta.';er.hidden=false})});

/* ---------- render ---------- */
function render(){
  var a=document.activeElement; if(a&&a.dataset&&a.dataset.live){pendingRender=true;return} pendingRender=false;
  var r=route(), app=$('#app'), html;
  document.body.classList.toggle('editing',editing);
  var eb=$('#editBtn'); eb.setAttribute('aria-pressed',editing?'true':'false'); eb.innerHTML=ic(editing?'check':'edit',1)+'<span>'+(editing?'Fine':'Modifica')+'</span>'; eb.hidden=!S.trip||SY.locked;
  paintSync();
  $('#topnav').innerHTML=navHtml(r.tab,1); $('#botnav').innerHTML=navHtml(r.tab);
  $('#brand').textContent=S.trip&&S.trip.title?'Diario '+S.trip.title:'Diario Giappone';
  if(SY.locked)html=vLock();
  else if(!S.ready)html='<p class="loading">Apro la guida…</p>';
  else if(!S.trip)html=vEmptyTrip();
  else if(r.v==='giorni')html=vGiorni(); else if(r.v==='giorno')html=vGiorno(r.id); else if(r.v==='mappa')html=vMappa(); else if(r.v==='promemoria')html=vPromemoria(); else html=vSunto();
  var y=window.scrollY; app.innerHTML=html; window.scrollTo(0,y);
}
window.addEventListener('hashchange',function(){if(takeKeyFromHash())return;mapSel=null;render();window.scrollTo(0,0);$('#app').focus({preventScroll:true})});

function toast(msg){var h=$('#toastHost');h.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){h.innerHTML=''},3200)}

/* ---------- note con salvataggio automatico ---------- */
var noteTimer=null;
function saveNote(el){var k=el.dataset.live,v=el.value;
  if(k==='trip'){if(S.trip.notes===v)return;S.trip.notes=v;saveTrip(true)}
  else{var d=day(k.slice(4));if(!d||d.notes===v)return;d.notes=v;saveDay(d,true)}
  var s=document.getElementById('saved-'+k);if(s)s.textContent='Salvato'}
document.addEventListener('input',function(e){var el=e.target;if(!el.dataset||!el.dataset.live)return;var s=document.getElementById('saved-'+el.dataset.live);if(s)s.textContent='';
  clearTimeout(noteTimer);noteTimer=setTimeout(function(){saveNote(el)},900)});
document.addEventListener('focusout',function(e){var el=e.target;if(!el.dataset||!el.dataset.live)return;clearTimeout(noteTimer);saveNote(el);
  setTimeout(function(){if(pendingRender)render()},0)});

/* ---------- scheda di modifica ---------- */
var sheet=null;
function openSheet(cfg){sheet=cfg;var v=cfg.values||{},host=$('#sheetHost');
  function fld(f){var id='f-'+f.k,val=v[f.k]==null?(f.def||''):v[f.k],c;
    if(f.t==='area')c='<textarea id="'+id+'" name="'+f.k+'">'+esc(val)+'</textarea>';
    else if(f.t==='select')c='<select id="'+id+'" name="'+f.k+'">'+f.opts.map(function(o){var ov=Array.isArray(o)?o[0]:o,ol=Array.isArray(o)?o[1]:o;return '<option value="'+esc(ov)+'"'+(String(ov)===String(val)?' selected':'')+'>'+esc(ol)+'</option>'}).join('')+'</select>';
    else c='<input id="'+id+'" name="'+f.k+'" type="'+(f.t||'text')+'" value="'+esc(val)+'"'+(f.t==='url'?' inputmode="url" autocapitalize="off"':'')+' autocomplete="off">';
    return '<div class="fld"><label for="'+id+'">'+esc(f.l)+(f.req?' *':'')+'</label>'+c+(f.h?'<small>'+esc(f.h)+'</small>':'')+'<small class="err" id="e-'+f.k+'" role="alert" hidden></small></div>'}
  var body='',i=0,fs=cfg.fields;
  while(i<fs.length){if(fs[i].half&&fs[i+1]&&fs[i+1].half){body+='<div class="two">'+fld(fs[i])+fld(fs[i+1])+'</div>';i+=2}else{body+=fld(fs[i]);i++}}
  host.innerHTML='<div class="scrim" data-act="sheet-scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-head"><h2 id="sheetTitle">'+esc(cfg.title)+'</h2>'+
    '<button type="button" class="icon-btn" data-act="sheet-close" aria-label="Chiudi">'+ic('x')+'</button></div><form id="sheetForm" novalidate>'+(cfg.intro||'')+body+
    '<div class="sheet-foot">'+(cfg.onDelete?'<button type="button" class="btn danger" data-act="sheet-del">Elimina</button>':'<span></span>')+'<button type="submit" class="btn">'+ic('check',1)+'Salva</button></div></form></div></div>';
  var first=host.querySelector('input,textarea,select');if(first)first.focus()}
function closeSheet(){sheet=null;$('#sheetHost').innerHTML='';if(SY.deferred){SY.deferred=null;scheduleSync(300)}}
document.addEventListener('submit',function(e){if(e.target.id!=='sheetForm')return;e.preventDefault();var out={},bad=null;
  sheet.fields.forEach(function(f){var el=e.target.elements[f.k],val=el.value.trim(),er=document.getElementById('e-'+f.k);er.hidden=true;
    if(f.req&&!val){er.textContent='Questo campo serve: scrivi almeno un nome.';er.hidden=false;bad=bad||el}
    if(f.t==='url'&&val&&!safeUrl(val)){er.textContent='Incolla un indirizzo web completo, per esempio https://…';er.hidden=false;bad=bad||el}
    if(f.coords&&val&&!getLL({coords:val})){er.textContent='Scrivi latitudine e longitudine, per esempio 35.7148, 139.7967';er.hidden=false;bad=bad||el}
    out[f.k]=f.t==='url'?safeUrl(val):(f.num?+val:val)});
  if(bad){bad.focus();return} var fn=sheet.onSave;closeSheet();fn(out);toast('Salvato')});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet)closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('g.pin')){e.preventDefault();act(e.target.closest('g.pin'))}});

/* modifica di un elemento in un elenco: nuovo se id assente */
function listEdit(title,fields,arr,id,save,defs){var cur=id?arr.find(function(x){return x.id===id}):null;
  openSheet({title:(cur?'Modifica ':'Nuovo: ')+title,fields:fields,values:cur||defs||{},
    onSave:function(o){if(cur)Object.assign(cur,o);else{o.id=uid();arr.push(o)}save()},
    onDelete:cur?function(){arr.splice(arr.indexOf(cur),1);save()}:null})}

function act(el){var a=el.dataset.act,id=el.dataset.id,d=el.dataset.day?day(el.dataset.day):null,t=S.trip;
  switch(a){
   case 'new-trip': S.trip=normTrip({title:'Giappone',subtitle:'',startDate:'',endDate:'',travelers:'',summary:'',notes:''});editing=true;saveTrip();
     openSheet({title:'Dati del viaggio',fields:F.trip,values:S.trip,onSave:function(o){Object.assign(S.trip,o);saveTrip()}});break;
   case 'edit-trip': openSheet({title:'Dati del viaggio',fields:F.trip,values:t,onSave:function(o){Object.assign(t,o);delete t.example;saveTrip()}});break;
   case 'new-flight': case 'edit-flight': listEdit('viaggio',F.flight,t.flights,id,saveTrip);break;
   case 'new-stay': case 'edit-stay': listEdit('alloggio',F.stay,t.stays,id,saveTrip);break;
   case 'new-tip': case 'edit-tip': if(d)listEdit('tip',F.tip,d.tips,id,function(){saveDay(d)});else listEdit('tip',F.tip,t.tips,id,saveTrip);break;
   case 'new-rem': case 'edit-rem': listEdit('promemoria',F.rem,t.reminders,id,saveTrip,{tz:'Europe/Rome'});break;
   case 'toggle-rem': var r=t.reminders.find(function(x){return x.id===id});if(r){r.done=!r.done;saveTrip()}break;
   case 'new-day': var last=S.days[S.days.length-1],nd='';if(last&&pDate(last.date)){var x=pDate(last.date);x.setDate(x.getDate()+1);nd=x.getFullYear()+'-'+two(x.getMonth()+1)+'-'+two(x.getDate())}else if(t.startDate)nd=t.startDate;
     openSheet({title:'Nuovo giorno',fields:F.day,values:{date:nd,city:last?last.city:'',color:last?last.color:'viola',hotel:last?last.hotel:'',hotelMaps:last?last.hotelMaps:'',hotelCoords:last?last.hotelCoords:''},
       onSave:function(o){o.id='d'+uid();normDay(o);o.notes='';S.days.push(o);saveDay(o,true);location.hash='giorno-'+o.id}});break;
   case 'edit-day': if(d)openSheet({title:'Dati del giorno',fields:F.day,values:d,onSave:function(o){Object.assign(d,o);saveDay(d)},onDelete:function(){removeDay(d.id);location.hash='giorni'}});break;
   case 'new-item': case 'edit-item': if(d)listEdit('tappa',F.item,d.items,id,function(){saveDay(d)},{kind:'Vedere'});break;
   case 'new-shop': case 'edit-shop': if(d)listEdit('negozio',F.shop,d.shops,id,function(){saveDay(d)});break;
   case 'toggle-item': if(d){var it=d.items.find(function(x){return x.id===id});if(it){it.done=!it.done;saveDay(d)}}break;
   case 'map-day': mapDay=el.dataset.day;mapSel=null;render();break;
   case 'open-map': mapDay=el.dataset.day;mapSel=null;break;
   case 'pin': mapSel=mapSel===el.dataset.k?null:el.dataset.k;
     if(route().v!=='mappa'){mapDay=el.dataset.k.split(':')[0];location.hash='mappa';}else{render();var c=$('#selCard');if(c&&c.scrollIntoView)c.scrollIntoView({block:'nearest'})}break;
   case 'sync-panel': openSync();break;
   case 'copy-invite': copyInvite();break;
   case 'sync-now': closeSheet();syncNow(true);break;
   case 'sheet-close': closeSheet();break;
   case 'sheet-del': if(el.dataset.sure){var fn=sheet.onDelete;closeSheet();fn();toast('Eliminato')}else{el.dataset.sure='1';el.textContent='Tocca ancora per eliminare'}break;
  }}
